name = "jetrag-api-proxy"
main = "src/index.js"
# 로컬 workerd(wrangler 4.86)가 2026-05-03 까지만 지원한다. 더 최신 날짜를 쓰면 배포는 되지만
# `wrangler dev` 가 안 떠서 **배포 전 검증을 못 한다** — 그게 더 큰 손해라 날짜를 맞춘다.
# 이 Worker 는 fetch 통과가 전부라 날짜에 따른 런타임 동작 차이가 없다.
compatibility_date = "2026-05-03"
# 이 Worker 는 커스텀 도메인 route 로만 받는다. workers.dev 주소는 열지 않는다.
workers_dev = false

[vars]
SUPABASE_FUNCTIONS_BASE = "https://mpmtydudhojpukuuadrd.supabase.co/functions/v1"
# 미이관 경로를 넘길 기존 백엔드.
# **Railway 의 기본 도메인**을 쓴다 — jetrag-api.woong-s.com 은 이 Worker 가 가로채므로
# 그걸 쓰면 자기 자신을 부르는 무한 루프가 된다.
# Phase 6 에서 이 값을 "" 로 바꾸면 Railway 의존이 끝난다.
LEGACY_ORIGIN = "https://jet-rag-production.up.railway.app"
# 함수를 DB 와 같은 지역에서 돌린다 (실측: 서울 132ms vs 미국서부 828ms).
# Supabase 기본 라우팅은 *호출자*(= 이 Worker) 근처를 고르는데, Worker 는 사용자
# 근처 PoP 에서 돌기 때문에 DB 와 멀어질 수 있다.
SUPABASE_FUNCTION_REGION = "ap-northeast-2"

[[routes]]
pattern = "jetrag-api.woong-s.com/*"
zone_name = "woong-s.com"
