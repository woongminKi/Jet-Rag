name: monitor search SLO

# 배포된 backend 의 /stats.search_slo 를 주기적으로 fetch 해 markdown snapshot 을 남긴다.
#
# ## 2026-09-07 — Railway 의존을 끊었다
# 예전에는 `JET_RAG_API_BASE` secret 이 Railway 주소를 담고 있었다. Railway 를 끄면
# 이 workflow 가 조용히 실패한다(리허설 §48.4-2). API base 는 **공개 URL 이라 secret 이
# 아니므로** 프록시 도메인을 기본값으로 박았다 — 이제 GitHub 설정에 의존하지 않는다.
#
# **`JET_RAG_API_BASE` secret 은 더 이상 읽지 않는다.** 남아 있다면 지워도 된다.
# 다른 곳을 보게 하려면 repo **variable** `JET_RAG_API_BASE` 를 설정한다.
# 단, 그 variable 이 이미 Railway 주소로 설정돼 있다면 여전히 그쪽이 이긴다 —
# 저장소에서는 확인할 수 없으니 Settings → Variables 에서 한 번 봐야 한다.
#
# 실행: 매일 02:00 UTC(11:00 KST) + Actions 탭에서 수동(`--warmup` 선택 가능).

on:
  workflow_dispatch:
    inputs:
      warmup:
        description: "golden 쿼리 8건으로 ring buffer warm 후 측정 (기본 false — 단순 snapshot)"
        type: boolean
        default: false
  schedule:
    - cron: "0 2 * * *"  # 매일 02:00 UTC = 11:00 KST

permissions:
  contents: read

jobs:
  monitor:
    name: snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # 공개 URL 이라 secret 이 아니다. 프록시 도메인이 기본이고, 다른 곳을 보려면
      # repo variable 로 덮는다. secret 은 의도적으로 읽지 않는다 — Railway 주소가
      # 남아 있을 수 있어서다.
      JET_RAG_API_BASE: ${{ vars.JET_RAG_API_BASE || 'https://jetrag-api.woong-s.com' }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
          enable-cache: true
      - name: uv sync (api dir)
        working-directory: api
        run: uv sync --frozen
      - name: monitor snapshot
        working-directory: api
        run: |
          if [ "${{ inputs.warmup }}" = "true" ]; then
            uv run python scripts/monitor_search_slo.py --warmup
          else
            uv run python scripts/monitor_search_slo.py
          fi
      - name: Upload snapshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-slo-snapshot-${{ github.run_id }}
          path: |
            work-log/*search_slo*.md
            work-log/*monitor*.md
          if-no-files-found: ignore
          retention-days: 30
