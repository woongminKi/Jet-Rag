name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 같은 ref 의 동시 실행 cancel — push 연속 시 자원 절약.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-test:
    name: api · 195+ unittest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    env:
      # 단위 테스트는 모두 mock.patch 기반 — 실 API 호출 0.
      # HF_API_TOKEN 만 dummy setdefault (embed_cache 등 import 단계에서 체크).
      # SUPABASE_URL/KEY 는 의도적으로 미설정 (세팅 시 _has_supabase_env() 가
      # 진짜 호출 시도하여 ConnectError — W7 Day 5 senior-developer 발견 사례).
      HF_API_TOKEN: dummy-test-token-ci
      GEMINI_API_KEY: dummy-test-token-ci
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
          enable-cache: true
      - name: uv sync
        run: uv sync --frozen
      - name: unittest discover
        run: uv run python -m unittest discover tests

  web-check:
    name: web · tsc + lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: tsc --noEmit
        run: pnpm exec tsc --noEmit
      - name: eslint
        run: pnpm lint

  edge-check:
    name: edge · deno fmt/lint/test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # supabase/functions 와 workers/api-proxy 는 deno.json 이 따로다.
      # 한쪽만 돌리면 다른 쪽 회귀를 놓친다.
      - name: functions · fmt
        working-directory: supabase/functions
        run: deno fmt --check
      - name: functions · lint
        working-directory: supabase/functions
        run: deno lint
      - name: functions · test
        working-directory: supabase/functions
        # jwt 테스트가 로컬 JWKS 서버를 띄우고 jose 를 npm 에서 받아온다.
        run: deno test --allow-env --allow-net --allow-read

      - name: proxy · fmt
        working-directory: workers/api-proxy
        run: deno fmt --check
      - name: proxy · lint
        working-directory: workers/api-proxy
        run: deno lint
      - name: proxy · test
        working-directory: workers/api-proxy
        run: deno test --allow-net

  edge-parity:
    name: edge · Python 동등성 대조
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
          enable-cache: true
      - name: uv sync
        working-directory: api
        run: uv sync --frozen

      # 이 검사기들이 이관의 실제 안전망이다. 단위 테스트는 "내가 이해한 계약" 을 고정할 뿐이고,
      # 여기서만 **Python 원본과 같은가** 를 본다. 실제로 버그를 잡은 적이 있다
      # (DEFAULT_USER_ID 접두어, base64 padding, jose 의 aud reason, Vary 덧붙이기).
      # 전부 로컬에서 돈다 — 배포된 함수나 시크릿이 필요 없다.
      - name: config
        working-directory: api
        run: uv run python scripts/verify_config_parity.py
      - name: cookie_token
        working-directory: api
        run: uv run python scripts/verify_cookie_token_parity.py
      - name: jwt
        working-directory: api
        run: uv run python scripts/verify_jwt_parity.py
      - name: current_user
        working-directory: api
        run: uv run python scripts/verify_current_user_parity.py
      - name: cors
        working-directory: api
        run: uv run python scripts/verify_cors_parity.py
      # --offline: 이 검사기의 파라미터 검증 부분은 운영 엔드포인트를 때린다.
      # CI 를 운영 가용성에 묶지 않으려고 순수 함수(PGroonga 질의 빌드)만 돌린다.
      - name: search params/pgroonga
        working-directory: api
        run: uv run python scripts/verify_search_params_parity.py --offline
      # 4.6 만 건 fuzz. 네트워크를 안 타므로 매 push 마다 돌려도 된다.
      - name: iso datetime (fuzz)
        working-directory: api
        run: uv run python scripts/verify_iso_datetime_parity.py
